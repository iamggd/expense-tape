<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tape</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#10302d;--ink:#e9f0ee;--paper:#f4f6f3;--pt:#18211f;--mute:#6b7a76;--acc:#f0a53a;--line:#d5dbd7;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,"Noto Sans Bengali",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:480px}
h1{font-size:20px;margin:4px 0 14px;font-weight:600}
.live{display:flex;gap:10px;margin-bottom:14px}
.live div{flex:1;background:#0b2422;border-radius:10px;padding:10px 12px}
.live small{color:#9db3ae;font-size:12px}
.live b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--acc);margin-top:2px}
.in{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:8px}
.seg{display:flex;border:1px solid #2f5651;border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--ink);padding:0 14px;font-size:16px;cursor:pointer}
.seg button.on{background:var(--acc);color:#2a1c00;font-weight:700}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #2f5651;background:#0b2422;color:var(--ink);font-size:16px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.add{background:var(--acc);color:#2a1c00;border:0;border-radius:8px;padding:0 22px;font-size:16px;font-weight:700;cursor:pointer}
.tape{background:var(--paper);color:var(--pt);border-radius:6px 6px 0 0;padding:6px 14px;max-height:300px;overflow-y:auto;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:28px 1fr auto 28px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.item .n{color:var(--mute);font-size:13px}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:14px}
.item .a{font-weight:600}
.item button{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer}
.empty{padding:22px 0;color:var(--mute);text-align:center;font-size:14px}
.tape-end{height:10px;background:var(--paper);border-radius:0 0 6px 6px;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/10px 100%;margin-bottom:14px}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.eq{background:#fff;color:#10302d;border:0;border-radius:10px;padding:16px;font-size:26px;font-weight:700;cursor:pointer}
.sec{background:none;border:1px solid #2f5651;color:var(--ink);border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
.acts .full{grid-column:1/-1}
.result{margin-top:14px;background:var(--acc);color:#2a1c00;border-radius:10px;padding:14px 16px}
.result h2{margin:0 0 6px;font-size:14px;font-weight:600}
.result .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.result p{margin:6px 0 0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <h1>Expense Tape</h1>

  <div class="live">
    <div><small>Total (৳ BDT)</small><b id="tBDT">0.00</b></div>
    <div><small>Total ($ USD)</small><b id="tUSD">0.00</b></div>
    <div><small>Entries</small><b id="cnt">0</b></div>
  </div>

  <div class="in">
    <div class="seg" role="group" aria-label="Currency">
      <button id="cBDT" class="on" type="button">৳</button>
      <button id="cUSD" type="button">$</button>
    </div>
    <input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Amount">
  </div>
  <div class="row2">
    <input id="note" type="text" maxlength="40" placeholder="What for? (optional)">
    <button class="add" id="add" type="button">+ Add</button>
  </div>

  <div class="tape" id="tape"></div>
  <div class="tape-end"></div>

  <div class="acts">
    <button class="eq" id="eq" type="button">=</button>
    <button class="sec" id="clear" type="button">Clear all</button>
    <button class="sec full" id="pdf" type="button">Export PDF</button>
  </div>

  <div class="result" id="result" hidden>
    <h2>Final result</h2>
    <div class="big" id="rBDT"></div>
    <div class="big" id="rUSD"></div>
    <p id="rCnt"></p>
  </div>
</div>

<script>
(function(){
  var KEY="expense-tape-entries-v1", OLD="hisab-entries-v1", entries=[], cur="BDT";
  var $=function(id){return document.getElementById(id)};

  try{entries=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||"[]")}catch(e){entries=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}

  // amounts stored as integer minor units (paisa/cents) to avoid float errors
  function fmt(m){return (m/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function sum(c){return entries.filter(function(e){return e.cur===c}).reduce(function(s,e){return s+e.amt},0)}
  var SYM={BDT:"৳",USD:"$"};

  function render(){
    $("tBDT").textContent=fmt(sum("BDT"));
    $("tUSD").textContent=fmt(sum("USD"));
    $("cnt").textContent=entries.length;
    var t=$("tape");
    if(!entries.length){t.innerHTML='<div class="empty">No entries yet. Type an amount and press + Add.</div>';return}
    t.innerHTML=entries.map(function(e,i){
      return '<div class="item"><span class="n">'+(i+1)+'</span><span class="t">'+esc(e.note||"—")+
      '</span><span class="a">'+SYM[e.cur]+' '+fmt(e.amt)+'</span><button type="button" data-i="'+i+'" aria-label="Delete entry '+(i+1)+'">×</button></div>';
    }).join("");
    t.scrollTop=t.scrollHeight;
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function setCur(c){cur=c;$("cBDT").classList.toggle("on",c==="BDT");$("cUSD").classList.toggle("on",c==="USD")}
  $("cBDT").onclick=function(){setCur("BDT")};
  $("cUSD").onclick=function(){setCur("USD")};

  function add(){
    var v=parseFloat($("amt").value);
    if(!isFinite(v)||v<=0){$("amt").focus();return}
    entries.push({amt:Math.round(v*100),cur:cur,note:$("note").value.trim()});
    save();$("amt").value="";$("note").value="";$("result").hidden=true;render();$("amt").focus();
  }
  $("add").onclick=add;
  ["amt","note"].forEach(function(id){$(id).addEventListener("keydown",function(e){if(e.key==="Enter")add()})});

  $("tape").addEventListener("click",function(e){
    var i=e.target.getAttribute&&e.target.getAttribute("data-i");
    if(i===null||i===undefined)return;
    entries.splice(+i,1);save();$("result").hidden=true;render();
  });

  $("clear").onclick=function(){
    if(entries.length&&!confirm("Delete all "+entries.length+" entries?"))return;
    entries=[];save();$("result").hidden=true;render();
  };

  $("eq").onclick=function(){
    $("rBDT").textContent="৳ "+fmt(sum("BDT"));
    $("rUSD").textContent="$ "+fmt(sum("USD"));
    $("rCnt").textContent="Counted "+entries.length+" time"+(entries.length===1?"":"s")+" ("+
      entries.filter(function(e){return e.cur==="BDT"}).length+" in BDT, "+
      entries.filter(function(e){return e.cur==="USD"}).length+" in USD)";
    $("result").hidden=false;
  };

  // jsPDF's built-in font is Latin-only: Bengali notes would turn into garbage, so replace them.
  function latin(s){return (s||"").replace(/[^\x20-\x7E]/g,"?")}

  $("pdf").onclick=function(){
    if(!entries.length){alert("Nothing to export yet.");return}
    if(!window.jspdf){alert("PDF library did not load. Check your internet connection and reload.");return}
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    var W=210,L=15,R=W-15,y=20;
    function head(){
      doc.setFont("helvetica","bold");doc.setFontSize(10);
      doc.text("#",L,y);doc.text("Note",L+12,y);doc.text("Currency",118,y);doc.text("Amount",150,y,{align:"right"});doc.text("Running total",R,y,{align:"right"});
      doc.line(L,y+2,R,y+2);y+=8;doc.setFont("helvetica","normal");
    }
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Expense Tape",L,y);
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    doc.text("Generated: "+new Date().toLocaleString("en-GB"),R,y,{align:"right"});y+=12;
    head();
    var run={BDT:0,USD:0};
    entries.forEach(function(e,i){
      if(y>275){doc.addPage();y=20;head()}
      run[e.cur]+=e.amt;
      doc.text(String(i+1),L,y);
      doc.text(latin(e.note)||"-",L+12,y,{maxWidth:100});
      doc.text(e.cur,118,y);
      doc.text(fmt(e.amt),150,y,{align:"right"});
      doc.text(fmt(run[e.cur]),R,y,{align:"right"});
      y+=7;
    });
    if(y>245){doc.addPage();y=20}
    y+=3;doc.line(L,y,R,y);y+=9;
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text("Total BDT:",L,y);doc.text(fmt(sum("BDT")),R,y,{align:"right"});y+=8;
    doc.text("Total USD:",L,y);doc.text(fmt(sum("USD")),R,y,{align:"right"});y+=8;
    doc.text("Total entries:",L,y);doc.text(String(entries.length),R,y,{align:"right"});
    doc.save("expense-tape-"+new Date().toISOString().slice(0,10)+".pdf");
  };

  render();
})();
</script>
</body>
</html>
